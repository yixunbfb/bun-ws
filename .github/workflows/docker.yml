name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Docker image tag'
        required: false
        default: 'manual'
        type: string
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64'
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      push_to_registries:
        description: 'Push to registries'
        required: false
        default: true
        type: boolean
  release:
    types: [created]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/${{ github.repository }}
          yixunbfb/bun-ws
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value=latest
          type=sha,prefix=
    
    - name: Set build date
      id: build_date
      run: echo "BUILD_DATE=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/${{ github.repository_owner }}/bun-ws:main,ghcr.io/${{ github.repository_owner }}/bun-ws:latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUN_VERSION=1
          BUILD_DATE=${{ env.BUILD_DATE }}
    
    - name: Create deployment info
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Docker image built successfully!"
        echo "Image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
        echo "Latest: ghcr.io/${{ github.repository }}:latest"
    
    - name: Update README with Docker info
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        cat >> $GITHUB_STEP_SUMMARY << 'EOF'
        ## 🐳 Docker Image Built Successfully
        
        ### Image Tags
        - `ghcr.io/${{ github.repository }}:${{ github.sha }}`
        - `ghcr.io/${{ github.repository }}:latest`
        - `yixunbfb/bun-ws:latest`
        
        ### Pull Command
        ```bash
        docker pull ghcr.io/${{ github.repository }}:latest
        ```
        
        ### Run Command
        ```bash
        docker run -p 8333:8333 -e DOMAIN="your-domain.com" ghcr.io/${{ github.repository }}:latest
        ```
        EOF

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'CRITICAL,HIGH'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-preview:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Generate deployment preview comment
      uses: actions/github-script@v7
      with:
        script: |
          const imageTag = `ghcr.io/${process.env.GITHUB_REPOSITORY}:${process.env.GITHUB_SHA?.substring(0, 7)}`;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: |
              ## 🚀 Docker Preview Ready

              ### Docker Image
              `${imageTag}`

              ### Quick Test
              ```bash
              docker pull ${imageTag}
              docker run -p 8333:8333 ${imageTag}
              ```

              Built successfully! 🐳
          })


