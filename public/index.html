<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuggingFace AI Chat</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="chat-header">
        <div class="container">
            <div class="header-content">
                <h1>HuggingFac AI Chat</h1>
                <div class="header-actions">
                    <button class="theme-toggle" id="theme-toggle" title="Switch theme">
                        <span class="theme-icon light-icon">☀️</span>
                        <span class="theme-icon dark-icon">🌙</span>
                    </button>
                    <span class="api-key-status" id="api-key-status">
                        <span class="dot not-configured"></span>
                        <span id="api-key-status-text">API Key Not Configured</span>
                    </span>
                    <button class="config-btn" id="open-config-btn">
                        ⚙️ Configure Key
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Notification Container -->
    <div id="notification-container" class="notification-container"></div>

    <main class="chat-container">
        <div id="chat-messages">
            <!-- Messages will be added here dynamically -->
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            AI is typing...
        </div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type your message here..." />
            <button class="send-btn" id="send-btn" disabled>➤</button>
        </div>
    </main>

    <!-- API Key Configuration Dialog -->
    <div class="dialog-overlay" id="config-dialog">
        <div class="dialog-content">
            <h2>Configure AI Settings</h2>
            <p>Configure your AI API settings. All settings will be stored locally in your browser.</p>
            <form id="config-form">
                <div class="form-group">
                    <label for="ai-url">AI API URL</label>
                    <input type="url" id="ai-url" placeholder="https://api.openai.com/v1/chat/completions" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="api-key">API Key</label>
                    <input type="text" id="api-key" placeholder="sk-..." autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="model">Model</label>
                    <input type="text" id="model" placeholder="gpt-3.5-turbo" autocomplete="off" />
                </div>
                <div class="dialog-actions">
                    <button type="button" class="btn-cancel" id="cancel-config-btn">Cancel</button>
                    <button type="submit" class="btn-save">Save & Test</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/chat.js"></script>
</body>
</html>
