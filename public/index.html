<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bun-ws AI Chat</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="chat-header">
        <div class="chat-header-content">
            <h1>bun-ws AI Chat</h1>
            <div class="header-actions">
                <div class="theme-toggle">
                    <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle theme">
                        <span class="theme-icon">🌙</span>
                    </button>
                </div>
                <span class="api-key-status" id="api-key-status">
                    <span class="dot not-configured"></span>
                    <span id="api-key-status-text">API Key Not Configured</span>
                </span>
                <button class="config-btn" id="open-config-btn">
                    ⚙️ Configure
                </button>
            </div>
        </div>
    </header>

    <main class="chat-container">
        <div class="fixed-question-header" id="fixed-question-header">
            <div class="question-icon">😊</div>
            <div class="question-content">
                <div class="question-text" id="fixed-question-text">上次的问题...</div>
                <div class="question-time" id="fixed-question-time"></div>
            </div>
        </div>
        
        <div id="chat-messages">
            <!-- Messages will be added here dynamically -->
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            AI is typing...
        </div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Type your message here..." />
            <button class="send-btn" id="send-btn" disabled>➤</button>
        </div>
    </main>

    <!-- API Key Configuration Dialog -->
    <div class="dialog-overlay" id="config-dialog">
        <div class="dialog-content">
            <h2>Configure AI API Key</h2>
            <p>Enter your OpenAI API key to enable AI chat functionality. This key will be stored locally in your browser.</p>
            <form id="config-form">
                <div class="form-group">
                    <label for="api-key">API Key</label>
                    <input type="text" id="api-key" placeholder="sk-..." autocomplete="off" />
                </div>
                <div class="dialog-actions">
                    <button type="button" class="btn-cancel" id="cancel-config-btn">Cancel</button>
                    <button type="submit" class="btn-save">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/chat.js"></script>
</body>
</html>
